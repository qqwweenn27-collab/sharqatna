name: Sharqatna CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check app.js
          node --check admin.js
      - name: Validate files
        run: |
          test -s index.html
          test -s admin.html
          test -s styles.css
          test -s supabase.js
