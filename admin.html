<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شرقاطنا</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div><h1>إدارة شرقاطنا</h1><p>إدارة السواق والرحلات والطلبات</p></div><div class="actions"><a class="admin-link" href="driver.html">السائق</a><a class="admin-link" href="index.html">التطبيق</a></div></header><main class="container"><section id="login" class="card"><h2>دخول الإدارة</h2><form id="loginForm" class="form-grid"><input name="email" type="email" required placeholder="البريد الإلكتروني"><input name="passcode" type="password" required placeholder="رمز الدخول"><button type="submit">دخول</button></form><p id="loginMsg"></p></section><section id="panel" hidden><div class="card"><div class="section-head"><h2>لوحة التحكم</h2><button id="logout">خروج</button></div><div class="stats"><b id="pendingCount">0</b><span>طلبات سواق</span><b id="tripPendingCount">0</b><span>رحلات معلقة</span><b id="adminDrivers">0</b><span>سواق</span><b id="adminAreas">0</b><span>مناطق</span></div></div><section class="card"><div class="section-head"><h2>الرحلات الأخيرة</h2><button id="refresh">تحديث</button></div><div id="trips"></div></section><section class="card"><div class="section-head"><h2>طلبات تسجيل السواق</h2></div><div id="requests"></div></section></section></main><div id="toast" class="toast"></div><script type="module" src="admin.js"></script></body></html>
