<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>سائقو شرقاطنا</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div><h1>🚕 شرقاطنا للسائق</h1><p>استقبل الرحلات وأدر حالتك</p></div><a class="admin-link" href="index.html">التطبيق</a></header><main class="container"><section id="login" class="card"><h2>دخول السائق</h2><p>استخدم حساب Supabase المخصص لك. يجب أن يربطك المدير بحساب السائق.</p><form id="loginForm" class="form-grid"><input name="email" type="email" required placeholder="البريد الإلكتروني"><input name="password" type="password" required placeholder="كلمة المرور"><button type="submit">دخول</button></form><p id="loginMsg"></p></section><section id="panel" hidden><section class="card"><div class="section-head"><div><span class="eyebrow">لوحة السائق</span><h2 id="driverName">السائق</h2></div><button id="logout">خروج</button></div><div class="driver-status"><span id="statusBadge" class="badge">غير متاح</span><button id="toggleOnline" class="primary">متاح لاستقبال الطلبات</button></div></section><section class="card"><div class="section-head"><h2>الطلبات القريبة/الجديدة</h2><button id="refresh">تحديث</button></div><div id="availableTrips"><div class="empty">جاري التحميل…</div></div></section><section class="card"><div class="section-head"><h2>رحلتي الحالية</h2></div><div id="currentTrip"><div class="empty">لا توجد رحلة حالية.</div></div></section><section class="card"><div class="section-head"><h2>رحلاتي الأخيرة</h2></div><div id="history"><div class="empty">لا توجد رحلات مكتملة بعد.</div></div></section></section></main><div id="toast" class="toast"></div><script type="module" src="driver.js"></script></body></html>
